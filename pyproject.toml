[project]
name = "fitpipeline"
version = "0.1.0"
description = "Segment classifier and primitive fitter for pre-segmented meshes"
readme = "README.md"
authors = [
    { name = "Sam Tuber", email = "samtuberr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
